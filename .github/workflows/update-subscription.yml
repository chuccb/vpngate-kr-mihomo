name: Update VPN Gate KR Mihomo subscription

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'vpngate_kr_mihomo.yaml'

permissions:
  contents: write

concurrency:
  group: vpngate-kr-mihomo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Generate candidate configuration
        run: |
          rm -rf build
          python vpngate_kr_mihomo_optimized.py --limit 10 --out-dir build --workers 4 --batch-size 8

      - name: Pin Clash process matching mode
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('build/vpngate_kr_mihomo.yaml')
          text = path.read_text(encoding='utf-8')
          marker = 'mode: rule\n'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one mode: rule marker, found {text.count(marker)}')
          text = text.replace(marker, marker + 'find-process-mode: strict\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate subscription before publishing
        env:
          MIN_PROXIES: '3'
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import yaml

          path = Path('build/vpngate_kr_mihomo.yaml')
          metadata_path = Path('build/source_candidates.json')
          if not path.is_file():
              raise SystemExit('generated YAML does not exist')
          if not metadata_path.is_file():
              raise SystemExit('candidate metadata does not exist')

          text = path.read_text(encoding='utf-8')
          cfg = yaml.safe_load(text)
          if not isinstance(cfg, dict):
              raise SystemExit('generated YAML root is not a mapping')
          if not text.startswith('# VPN Gate KR Mihomo subscription generated by benchmark v7.2\n'):
              raise SystemExit('unexpected generator version')
          if cfg.get('find-process-mode') != 'strict':
              raise SystemExit('find-process-mode must be strict for process routing')

          metadata = yaml.safe_load(metadata_path.read_text(encoding='utf-8'))
          if not isinstance(metadata, dict):
              raise SystemExit('candidate metadata root is not a mapping')
          if metadata.get('source_api') != 'https://www.vpngate.net/api/iphone/':
              raise SystemExit('unexpected CSV API source')
          if metadata.get('source_udp_endpoint_discovery') != 'https://www.vpngate.net/en/':
              raise SystemExit('unexpected UDP endpoint discovery source')
          if metadata.get('script_version') != 'v7.2':
              raise SystemExit('unexpected generator version')
          if metadata.get('base_parser_version') != 'v7.1':
              raise SystemExit('unexpected base parser version')
          if metadata.get('ping_threshold_ms_exclusive') != 40:
              raise SystemExit('unexpected Ping threshold in metadata')

          proxies = cfg.get('proxies')
          groups = cfg.get('proxy-groups')
          rules = cfg.get('rules')
          tun = cfg.get('tun')
          minimum = int(os.environ['MIN_PROXIES'])

          if not isinstance(proxies, list) or len(proxies) < minimum:
              raise SystemExit(f'proxy count below safety threshold: {len(proxies) if isinstance(proxies, list) else 0} < {minimum}')
          if len(proxies) > 10:
              raise SystemExit(f'proxy count exceeds configured maximum: {len(proxies)} > 10')
          if not isinstance(groups, list) or len(groups) != 1:
              raise SystemExit('expected exactly one proxy group')
          if 'PROCESS-NAME,FreeStyleReboot.exe,KR-LOWEST' not in (rules or []):
              raise SystemExit('FreeStyle Reboot rule missing')
          if not isinstance(tun, dict) or tun.get('enable') is not True:
              raise SystemExit('TUN configuration missing/disabled')
          if tun.get('stack') != 'system':
              raise SystemExit(f"unexpected TUN stack: {tun.get('stack')}")
          if tun.get('auto-route') is not True or tun.get('auto-detect-interface') is not True:
              raise SystemExit('unexpected TUN routing settings')

          allowed_ciphers = {
              'AES-128-GCM', 'AES-256-GCM', 'AES-128-CBC', 'AES-256-CBC', 'CHACHA20-POLY1305', 'AES-CBC'
          }
          allowed_auth = {'MD5', 'SHA1', 'SHA256', 'SHA384', 'SHA512'}
          allowed_comp = {'yes', 'no', 'adaptive'}

          names = []
          for proxy in proxies:
              if not isinstance(proxy, dict):
                  raise SystemExit('proxy entry is not a mapping')
              if proxy.get('type') != 'openvpn':
                  raise SystemExit(f"unexpected proxy type: {proxy.get('type')}")
              if proxy.get('proto') != 'udp' or proxy.get('udp') is not True:
                  raise SystemExit(f"non-UDP proxy emitted: {proxy.get('name')}")
              name = proxy.get('name')
              if not isinstance(name, str) or not name:
                  raise SystemExit('proxy name missing')
              names.append(name)

              if not isinstance(proxy.get('server'), str) or not proxy.get('server'):
                  raise SystemExit(f'OpenVPN server missing: {name}')
              port = proxy.get('port')
              if not isinstance(port, int) or not 1 <= port <= 65535:
                  raise SystemExit(f'invalid OpenVPN port: {name}: {port}')

              has_userpass = 'username' in proxy or 'password' in proxy
              has_cert = 'cert' in proxy
              has_key = 'key' in proxy
              if has_cert != has_key:
                  raise SystemExit(f'certificate/key must be paired: {name}')
              if has_userpass and (has_cert or has_key):
                  raise SystemExit(f'mixed OpenVPN authentication modes: {name}')
              if not has_userpass and not has_cert:
                  raise SystemExit(f'OpenVPN authentication missing: {name}')

              if 'tls-auth' in proxy and ('tls-crypt' in proxy or 'tls-crypt-v2' in proxy):
                  raise SystemExit(f'mutually-exclusive TLS settings: {name}')
              if 'tls-crypt' in proxy and 'tls-crypt-v2' in proxy:
                  raise SystemExit(f'mutually-exclusive TLS crypt settings: {name}')
              if 'tls-auth' in proxy and proxy.get('key-direction') not in {'0', '1'}:
                  raise SystemExit(f'invalid key-direction: {name}')

              cipher = proxy.get('cipher')
              if cipher is not None and cipher not in allowed_ciphers:
                  raise SystemExit(f'unsupported cipher: {name}: {cipher}')
              auth = proxy.get('auth')
              if auth is not None and auth not in allowed_auth:
                  raise SystemExit(f'unsupported auth: {name}: {auth}')
              comp = proxy.get('comp-lzo')
              if comp is not None and str(comp).lower() not in allowed_comp:
                  raise SystemExit(f'unsupported comp-lzo: {name}: {comp}')

              data_ciphers = proxy.get('data-ciphers')
              if data_ciphers is not None:
                  if not isinstance(data_ciphers, list) or not data_ciphers:
                      raise SystemExit(f'invalid data-ciphers in Mihomo: {name}')
                  if any(x not in allowed_ciphers for x in data_ciphers):
                      raise SystemExit(f'unsupported data-ciphers: {name}: {data_ciphers}')

              fallback = proxy.get('data-ciphers-fallback')
              if fallback is not None and fallback not in allowed_ciphers:
                  raise SystemExit(f'unsupported data-ciphers-fallback: {name}: {fallback}')

              for field in ('ca', 'cert', 'key', 'tls-auth', 'tls-crypt', 'tls-crypt-v2'):
                  value = proxy.get(field)
                  if isinstance(value, str) and 'BEGIN ' in value and '\n' not in value:
                      raise SystemExit(f'PEM newline corruption: {name}:{field}')

          if len(names) != len(set(names)):
              raise SystemExit('duplicate proxy names')

          selected = metadata.get('selected')
          if not isinstance(selected, list) or len(selected) != len(proxies):
              raise SystemExit('candidate metadata count does not match proxy count')
          if any(
              not isinstance(item, dict)
              or item.get('country_short') != 'KR'
              or item.get('country_long', '').lower() != 'korea republic of'
              or not isinstance(item.get('ping'), int)
              or not 0 <= item['ping'] < 40
          for item in selected):
              raise SystemExit('candidate metadata contains an invalid selected node')

          lowest = groups[0]
          if not isinstance(lowest, dict) or lowest.get('name') != 'KR-LOWEST' or lowest.get('type') != 'url-test':
              raise SystemExit('KR-LOWEST url-test group missing')
          if lowest.get('proxies') != names:
              raise SystemExit('KR-LOWEST proxy list does not match generated proxies')
          if lowest.get('url') != 'https://www.naver.com/':
              raise SystemExit('unexpected KR-LOWEST health-check URL')
          if lowest.get('interval') != 60:
              raise SystemExit('unexpected health-check interval')
          if lowest.get('timeout') != 3000:
              raise SystemExit('unexpected health-check timeout')
          if lowest.get('tolerance') != 0:
              raise SystemExit('KR-LOWEST tolerance must remain 0')
          if lowest.get('lazy') is not True:
              raise SystemExit('KR-LOWEST lazy health-check mode must be enabled')
          if lowest.get('expected-status') != 200:
              raise SystemExit('unexpected expected-status')
          if lowest.get('disable-udp') is not False:
              raise SystemExit('KR-LOWEST must keep UDP enabled')

          print(f'validated proxies={len(proxies)}; single group=KR-LOWEST; max=10; lazy=true; find-process-mode=strict; source=VPN Gate CSV + official UDP endpoint discovery; Ping threshold=<40ms')
          PY

      - name: Publish only after validation succeeds
        if: github.ref == 'refs/heads/main'
        run: |
          cp build/vpngate_kr_mihomo.yaml vpngate_kr_mihomo.yaml
          rm -rf build

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add vpngate_kr_mihomo.yaml
          if git diff --cached --quiet; then
            echo 'Subscription unchanged; nothing to commit.'
            exit 0
          fi

          git commit -m 'Update VPN Gate KR Mihomo subscription'

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "git push failed; rebasing onto current origin/main (attempt ${attempt}/3)"
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --soft origin/main
              git add vpngate_kr_mihomo.yaml
              git commit -m 'Update VPN Gate KR Mihomo subscription'
            }
          done
          echo 'failed to publish after 3 attempts'
          exit 1
