name: Update VPN Gate KR Mihomo subscription

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/update-subscription.yml'
      - 'vpngate_kr_mihomo.py'
      - 'tests/**'
      - 'tools/benchmark_clash_verge.py'
      - 'requirements.txt'
  push:
    branches: [main]
    paths-ignore:
      - 'vpngate_kr_mihomo.yaml'

permissions:
  contents: read

concurrency:
  group: vpngate-kr-mihomo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check syntax
        run: python -m py_compile vpngate_kr_mihomo.py tools/benchmark_clash_verge.py
      - name: Generate
        run: |
          rm -rf build
          python vpngate_kr_mihomo.py generate --limit 10 --out-dir build --workers 4 --batch-size 8
      - name: Validate generated output
        run: python vpngate_kr_mihomo.py validate build/vpngate_kr_mihomo.yaml
      - name: Validate metadata consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('build/vpngate_kr_mihomo.yaml').read_text(encoding='utf-8'))
          meta = json.loads(Path('build/source_candidates.json').read_text(encoding='utf-8'))
          if meta.get('generator_version') != '8.0': raise SystemExit('unexpected generator version')
          if meta.get('source_api') != 'https://www.vpngate.net/api/iphone/': raise SystemExit('unexpected API source')
          if len(meta.get('selected', [])) != len(cfg.get('proxies', [])): raise SystemExit('metadata/proxy count mismatch')
          for i, item in enumerate(meta['selected']):
              proxy = cfg['proxies'][i]
              if item.get('profile_server') != proxy.get('server') or item.get('profile_port') != proxy.get('port') or item.get('stable_proxy_name') != proxy.get('name'):
                  raise SystemExit(f'metadata mismatch at proxy {i + 1}')
          print(f"metadata validated: proxies={len(cfg['proxies'])}")
          PY
      - name: Test with official Mihomo stable
        run: |
          docker run --rm --pull=always -v "$PWD/build:/work:ro" metacubex/mihomo:v1.19.30 -t -d /work -f /work/vpngate_kr_mihomo.yaml
      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp build/vpngate_kr_mihomo.yaml vpngate_kr_mihomo.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vpngate_kr_mihomo.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update VPN Gate KR Mihomo subscription'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; git reset --soft origin/main; git add vpngate_kr_mihomo.yaml; git commit -m 'Update VPN Gate KR Mihomo subscription'; }
          done
          exit 1
