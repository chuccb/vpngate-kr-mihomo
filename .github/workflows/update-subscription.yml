name: Update VPN Gate KR Mihomo subscription

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/update-subscription.yml'
      - 'vpngate_kr_mihomo_benchmark_v6.py'
      - 'vpngate_kr_mihomo_optimized.py'
      - 'vpngate_kr_mihomo_v7_3.py'
      - 'tests/**'
      - 'tools/**'
      - 'requirements.txt'
  push:
    branches:
      - main
    paths-ignore:
      - 'vpngate_kr_mihomo.yaml'

permissions:
  contents: read

concurrency:
  group: vpngate-kr-mihomo-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Python syntax
        run: python -m py_compile vpngate_kr_mihomo_benchmark_v6.py vpngate_kr_mihomo_optimized.py vpngate_kr_mihomo_v7_3.py tools/benchmark_clash_verge.py

      - name: Generate candidate configuration
        run: |
          rm -rf build
          python vpngate_kr_mihomo_v7_3.py --limit 10 --out-dir build --workers 4 --batch-size 8

      - name: Validate generated configuration
        env:
          MIN_PROXIES: '3'
          EXPECTED_HEALTH_URL: 'http://www.gstatic.com/generate_204'
          EXPECTED_HEALTH_STATUS: '204'
          EXPECTED_HEALTH_INTERVAL: '60'
          EXPECTED_HEALTH_TIMEOUT: '3000'
          EXPECTED_HEALTH_TOLERANCE: '5'
          EXPECTED_HEALTH_MAX_FAILED_TIMES: '2'
          EXPECTED_LAZY: 'false'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import yaml

          path = Path('build/vpngate_kr_mihomo.yaml')
          metadata_path = Path('build/source_candidates.json')
          if not path.is_file():
              raise SystemExit('generated YAML does not exist')
          if not metadata_path.is_file():
              raise SystemExit('candidate metadata does not exist')

          cfg = yaml.safe_load(path.read_text(encoding='utf-8'))
          if not isinstance(cfg, dict):
              raise SystemExit('generated YAML root is not a mapping')
          text = path.read_text(encoding='utf-8')
          if not text.startswith('# VPN Gate KR Mihomo subscription generated by benchmark v7.3\n'):
              raise SystemExit('unexpected generator version')
          if cfg.get('find-process-mode') != 'strict':
              raise SystemExit('find-process-mode must be strict for PROCESS-NAME routing')
          if cfg.get('profile', {}).get('store-selected') is not True:
              raise SystemExit('profile.store-selected must be enabled')

          metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
          if not isinstance(metadata, dict):
              raise SystemExit('candidate metadata root is not an object')
          if metadata.get('source_api') != 'https://www.vpngate.net/api/iphone/':
              raise SystemExit('unexpected CSV API source')
          if metadata.get('source_udp_endpoint_discovery') != 'https://www.vpngate.net/en/':
              raise SystemExit('unexpected UDP endpoint discovery source')
          if metadata.get('script_version') != 'v7.3' or metadata.get('base_parser_version') != 'v7.1':
              raise SystemExit('unexpected generator/parser version')
          if metadata.get('ping_threshold_ms_exclusive') != 40:
              raise SystemExit('unexpected Ping threshold in metadata')
          if metadata.get('health_check_url') != os.environ['EXPECTED_HEALTH_URL']:
              raise SystemExit('unexpected health-check URL in metadata')
          if metadata.get('health_check_expected_status') != int(os.environ['EXPECTED_HEALTH_STATUS']):
              raise SystemExit('unexpected health-check status in metadata')
          if metadata.get('health_check_interval_seconds') != int(os.environ['EXPECTED_HEALTH_INTERVAL']):
              raise SystemExit('unexpected health-check interval in metadata')
          if metadata.get('health_check_timeout_ms') != int(os.environ['EXPECTED_HEALTH_TIMEOUT']):
              raise SystemExit('unexpected health-check timeout in metadata')
          if metadata.get('health_check_max_failed_times') != int(os.environ['EXPECTED_HEALTH_MAX_FAILED_TIMES']):
              raise SystemExit('unexpected max-failed-times in metadata')

          proxies = cfg.get('proxies')
          groups = cfg.get('proxy-groups')
          rules = cfg.get('rules')
          tun = cfg.get('tun')
          minimum = int(os.environ['MIN_PROXIES'])
          if not isinstance(proxies, list) or len(proxies) < minimum:
              raise SystemExit(f'proxy count below safety threshold: {len(proxies) if isinstance(proxies, list) else 0} < {minimum}')
          if len(proxies) > 10:
              raise SystemExit(f'proxy count exceeds configured maximum: {len(proxies)} > 10')
          if not isinstance(groups, list) or len(groups) != 1:
              raise SystemExit('expected exactly one proxy group')
          if rules != ['PROCESS-NAME,FreeStyleReboot.exe,KR-LOWEST', 'MATCH,DIRECT']:
              raise SystemExit('unexpected routing rules')
          if not isinstance(tun, dict) or tun.get('enable') is not True:
              raise SystemExit('TUN configuration missing/disabled')
          if tun.get('stack') != 'system' or tun.get('auto-route') is not True or tun.get('auto-detect-interface') is not True:
              raise SystemExit('unexpected TUN routing settings')

          names = []
          allowed_ciphers = {'AES-128-GCM', 'AES-256-GCM', 'AES-128-CBC', 'AES-256-CBC', 'CHACHA20-POLY1305', 'AES-CBC'}
          allowed_auth = {'MD5', 'SHA1', 'SHA256', 'SHA384', 'SHA512'}
          allowed_comp = {'yes', 'no', 'adaptive'}
          for proxy in proxies:
              if not isinstance(proxy, dict) or proxy.get('type') != 'openvpn':
                  raise SystemExit('unexpected proxy type')
              if proxy.get('proto') != 'udp' or proxy.get('udp') is not True:
                  raise SystemExit(f"non-UDP proxy emitted: {proxy.get('name')}")
              name = proxy.get('name')
              if not isinstance(name, str) or not name:
                  raise SystemExit('proxy name missing')
              names.append(name)
              if not isinstance(proxy.get('server'), str) or not proxy.get('server'):
                  raise SystemExit(f'OpenVPN server missing: {name}')
              port = proxy.get('port')
              if not isinstance(port, int) or not 1 <= port <= 65535:
                  raise SystemExit(f'invalid OpenVPN port: {name}: {port}')

              has_userpass = 'username' in proxy or 'password' in proxy
              has_cert = 'cert' in proxy
              has_key = 'key' in proxy
              if has_cert != has_key or (has_userpass and (has_cert or has_key)) or (not has_userpass and not has_cert):
                  raise SystemExit(f'invalid OpenVPN authentication mode: {name}')
              if 'tls-auth' in proxy and ('tls-crypt' in proxy or 'tls-crypt-v2' in proxy):
                  raise SystemExit(f'mutually-exclusive TLS settings: {name}')
              if 'tls-crypt' in proxy and 'tls-crypt-v2' in proxy:
                  raise SystemExit(f'mutually-exclusive TLS crypt settings: {name}')
              if 'tls-auth' in proxy and proxy.get('key-direction') not in {'0', '1'}:
                  raise SystemExit(f'invalid key-direction: {name}')
              if 'tls-auth' in proxy and str(proxy.get('auth', 'SHA1')).upper() != 'SHA1':
                  raise SystemExit(f'tls-auth non-SHA1 profile must not be emitted: {name}')

              if proxy.get('cipher') is not None and proxy['cipher'] not in allowed_ciphers:
                  raise SystemExit(f'unsupported cipher: {name}')
              if proxy.get('auth') is not None and proxy['auth'] not in allowed_auth:
                  raise SystemExit(f'unsupported auth: {name}')
              if proxy.get('comp-lzo') is not None and str(proxy['comp-lzo']).lower() not in allowed_comp:
                  raise SystemExit(f'unsupported comp-lzo: {name}')
              data_ciphers = proxy.get('data-ciphers')
              if data_ciphers is not None and (not isinstance(data_ciphers, list) or not data_ciphers or any(x not in allowed_ciphers for x in data_ciphers)):
                  raise SystemExit(f'unsupported data-ciphers: {name}')
              fallback = proxy.get('data-ciphers-fallback')
              if fallback is not None and fallback not in allowed_ciphers:
                  raise SystemExit(f'unsupported data-ciphers-fallback: {name}')
              for field in ('ca', 'cert', 'key', 'tls-auth', 'tls-crypt', 'tls-crypt-v2'):
                  value = proxy.get(field)
                  if isinstance(value, str) and 'BEGIN ' in value and '\n' not in value:
                      raise SystemExit(f'PEM newline corruption: {name}:{field}')

          if len(names) != len(set(names)):
              raise SystemExit('duplicate proxy names')

          selected = metadata.get('selected')
          if not isinstance(selected, list) or len(selected) != len(proxies):
              raise SystemExit('candidate metadata count does not match proxy count')
          for index, item in enumerate(selected):
              if not isinstance(item, dict):
                  raise SystemExit(f'candidate metadata item {index + 1} is not an object')
              if item.get('country_short') != 'KR' or item.get('country_long', '').lower() != 'korea republic of':
                  raise SystemExit(f'candidate metadata item {index + 1} is not KR')
              ping = item.get('ping')
              if not isinstance(ping, int) or not 0 <= ping < 40:
                  raise SystemExit(f'candidate metadata item {index + 1} has invalid Ping')
              profile_server = item.get('profile_server', item.get('ip'))
              profile_port = item.get('profile_port', item.get('udp_port'))
              if profile_server != proxies[index].get('server'):
                  raise SystemExit(f'proxy {index + 1} server does not match candidate metadata')
              if profile_port != proxies[index].get('port'):
                  raise SystemExit(f'proxy {index + 1} UDP port does not match candidate metadata')

          lowest = groups[0]
          if not isinstance(lowest, dict) or lowest.get('name') != 'KR-LOWEST' or lowest.get('type') != 'url-test':
              raise SystemExit('KR-LOWEST url-test group missing')
          if lowest.get('proxies') != names:
              raise SystemExit('KR-LOWEST proxy list does not match generated proxies')
          if lowest.get('url') != os.environ['EXPECTED_HEALTH_URL']:
              raise SystemExit('unexpected KR-LOWEST health-check URL')
          if lowest.get('interval') != int(os.environ['EXPECTED_HEALTH_INTERVAL']) or lowest.get('timeout') != int(os.environ['EXPECTED_HEALTH_TIMEOUT']):
              raise SystemExit('unexpected health-check timing')
          if lowest.get('tolerance') != int(os.environ['EXPECTED_HEALTH_TOLERANCE']):
              raise SystemExit('unexpected health-check tolerance')
          if lowest.get('max-failed-times') != int(os.environ['EXPECTED_HEALTH_MAX_FAILED_TIMES']):
              raise SystemExit('unexpected max-failed-times')
          if lowest.get('lazy') is not (os.environ['EXPECTED_LAZY'].lower() == 'true'):
              raise SystemExit('unexpected lazy setting')
          if lowest.get('expected-status') != int(os.environ['EXPECTED_HEALTH_STATUS']) or lowest.get('disable-udp') is not False:
              raise SystemExit('unexpected url-test status/UDP settings')

          print(
              f"validated proxies={len(proxies)}; URL={os.environ['EXPECTED_HEALTH_URL']}; "
              f"expected-status={os.environ['EXPECTED_HEALTH_STATUS']}; "
              f"interval={os.environ['EXPECTED_HEALTH_INTERVAL']}s; "
              f"timeout={os.environ['EXPECTED_HEALTH_TIMEOUT']}ms; "
              f"tolerance={os.environ['EXPECTED_HEALTH_TOLERANCE']}ms; "
              f"lazy={os.environ['EXPECTED_LAZY']}; "
              f"max-failed-times={os.environ['EXPECTED_HEALTH_MAX_FAILED_TIMES']}; "
              f"find-process-mode=strict"
          )
          PY

      - name: Test configuration with official Mihomo
        run: |
          docker run --rm --pull=always \
            -v "$PWD/build:/work:ro" \
            metacubex/mihomo:v1.19.30 \
            -t -d /work -f /work/vpngate_kr_mihomo.yaml

      - name: Publish only after validation succeeds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp build/vpngate_kr_mihomo.yaml vpngate_kr_mihomo.yaml
          rm -rf build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vpngate_kr_mihomo.yaml
          if git diff --cached --quiet; then
            echo 'Subscription unchanged; nothing to commit.'
            exit 0
          fi
          git commit -m 'Update VPN Gate KR Mihomo subscription'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "git push failed; rebasing onto current origin/main (attempt ${attempt}/3)"
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git reset --soft origin/main
              git add vpngate_kr_mihomo.yaml
              git commit -m 'Update VPN Gate KR Mihomo subscription'
            }
          done
          echo 'failed to publish after 3 attempts'
          exit 1
